name: cartorios-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      BCRYPT_ROUNDS: "4"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: cartorios
      DB_USERNAME: cartorios
      DB_PASSWORD: cartorios_dev
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ..:/workspace/cartorios:cached
      - composer-vendor:/workspace/cartorios/vendor

  database:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: cartorios
      MYSQL_USER: cartorios
      MYSQL_PASSWORD: cartorios_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  composer-vendor:
  mysql-data:
